<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The Mandate mark: two limits holding one payment.

    Identical geometry to MandateMark in components/layout/SiteNav.tsx. This is a static
    file rather than a generated PNG so the tab icon and the header mark are the same
    drawing, not two drawings that happen to look alike.

    The payment dot is ink on a light tab and white on a dark one. Without that, the dot
    disappears against a dark tab strip and the mark reads as empty brackets.
  -->
  <style>
    .payment { fill: #121212 }
    @media (prefers-color-scheme: dark) { .payment { fill: #ffffff } }
  </style>
  <g fill="#ff2fb6" stroke="#ff2fb6" stroke-width="1.1" stroke-linejoin="round">
    <path d="M5,6.5 H11 V8.6 H7.6 V23.4 H11 V25.5 H5 Z"/>
    <path d="M27,6.5 H21 V8.6 H24.4 V23.4 H21 V25.5 H27 Z"/>
  </g>
  <circle class="payment" cx="16" cy="16" r="3.4"/>
</svg>
